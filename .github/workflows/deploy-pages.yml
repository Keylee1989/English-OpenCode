# Deploy subpath GitHub Pages variant of English360.
#
# PURPOSE: This is deploy-ONLY. It builds a SUBPATH PWA variant
#   (base=/English-OpenCode/) for https://<owner>.github.io/<repo>/ because
#   GitHub Pages project sites are served at that subpath, while the canonical
#   product build is root-path ('/' start_url/scope) and is unchanged here.
# The variant is produced entirely in CI (vite --base + pages-postprocess.cjs);
# vite.config.ts (root '/') is NEVER modified.
name: Deploy English360 Pages (subpath variant)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Give the Pages deployment workflow exactly the permissions it needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Build subpath variant
        run: npx vite build --base=/English-OpenCode/ --outDir dist

      - name: Post-process PWA for subpath (manifest + sw.js)
        run: node scripts/pages-postprocess.cjs --dist=dist --base=/English-OpenCode/

      - name: SPA fallback page for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
