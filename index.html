<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for iOS safe-area (notch / home indicator) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="English360 GPT - 长期自适应英语学习系统（零基础 → 美式英语实用母语级）" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Apply the persisted theme before the bundle loads to avoid a flash of
         the wrong appearance. Mirrors src/theme.ts (default: dark). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("english360.theme");
          var choice = t === "light" || t === "system" || t === "dark" ? t : "dark";
          var effective =
            choice === "system"
              ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
              : choice;
          document.documentElement.dataset.theme = effective;
          document.documentElement.style.colorScheme = effective;
        } catch (e) {}
      })();
    </script>


    <!-- iOS PWA support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="English360" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>English360 GPT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
